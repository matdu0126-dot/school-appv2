<script>

/* =====================================================
   기본 설정
===================================================== */

const NEIS_KEY =
    "7578d97feec449a28b001c18538d22ed";

const OFFICE_CODE =
    "J10";

const SCHOOL_CODE =
    "7530049";

const MEAL_SERVER =
    "https://meal-server-1.onrender.com/meal";


/* =====================================================
   날짜
===================================================== */

function formatDate(date) {

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function getMonday(date) {

    const result =
        new Date(date);

    const day =
        result.getDay();

    const difference =
        day === 0
            ? -6
            : 1 - day;

    result.setDate(
        result.getDate() + difference
    );

    result.setHours(
        0,
        0,
        0,
        0
    );

    return result;
}


/* =====================================================
   급식
===================================================== */

async function loadMeal() {

    const result =
        document.getElementById(
            "meal-result"
        );

    const dateElement =
        document.getElementById(
            "meal-date"
        );

    const today =
        new Date();

    dateElement.textContent =
        `${today.getFullYear()}년 ${
            today.getMonth() + 1
        }월 ${
            today.getDate()
        }일`;

    result.className =
        "loading";

    result.textContent =
        "급식 정보를 불러오는 중입니다...";


    try {

        const response =
            await fetch(
                MEAL_SERVER
            );

        if (!response.ok) {
            throw new Error(
                "급식 서버 오류"
            );
        }

        const data =
            await response.json();

        const rows =
            data
                ?.mealServiceDietInfo
                ?.[1]
                ?.row;


        if (
            !rows ||
            rows.length === 0
        ) {

            result.className =
                "error";

            result.textContent =
                "오늘 급식 정보가 없습니다.";

            return;
        }


        const todayString =
            formatDate(today);

        const todayMeal =
            rows.find(
                row =>
                    row?.MLSV_YMD ===
                    todayString
            );


        if (!todayMeal) {

            result.className =
                "error";

            result.textContent =
                "오늘 급식 정보가 없습니다.";

            return;
        }


        let menu =
            todayMeal.DDISH_NM || "";


        menu =
            menu
                .replace(
                    /<br\/?>/gi,
                    "\n"
                )
                .replace(
                    /\([^)]*\)/g,
                    ""
                )
                .replace(
                    /\*/g,
                    ""
                )
                .trim();


        result.className =
            "meal-menu";

        result.textContent =
            menu ||
            "급식 정보가 없습니다.";


    } catch (error) {

        console.error(
            "급식 오류:",
            error
        );

        result.className =
            "error";

        result.textContent =
            "급식 정보를 불러오지 못했습니다.";
    }
}


/* =====================================================
   NEIS 기본 URL
===================================================== */

function createNeisUrl(
    date,
    grade,
    classNumber = null
) {

    const params =
        new URLSearchParams();

    params.set(
        "KEY",
        NEIS_KEY
    );

    params.set(
        "Type",
        "json"
    );

    params.set(
        "pIndex",
        "1"
    );

    params.set(
        "pSize",
        "1000"
    );

    params.set(
        "ATPT_OFCDC_SC_CODE",
        OFFICE_CODE
    );

    params.set(
        "SD_SCHUL_CODE",
        SCHOOL_CODE
    );

    params.set(
        "ALL_TI_YMD",
        formatDate(date)
    );

    params.set(
        "GRADE",
        String(grade)
    );


    /*
     * ⭐ 중요
     *
     * 1, 2학년은 선택한 반으로 요청
     *
     * 3학년은 classNumber를 넣지 않고
     * 일단 3학년 전체 시간표를 요청한다.
     *
     * 그래서 기존의
     *
     * GRADE=3&CLASS_NM=2
     *
     * 때문에 INFO-200이 나오는 문제를 피한다.
     */

    if (
        String(grade) !== "3" &&
        classNumber !== null
    ) {

        params.set(
            "CLASS_NM",
            String(classNumber)
        );
    }


    return (
        "https://open.neis.go.kr/hub/hisTimetable?"
        +
        params.toString()
    );
}


/* =====================================================
   NEIS 데이터 가져오기
===================================================== */

async function getTimetableData(
    date,
    grade,
    classNumber
) {

    const url =
        createNeisUrl(
            date,
            grade,
            classNumber
        );


    console.log(
        "=============================="
    );

    console.log(
        "시간표 요청 날짜:",
        formatDate(date)
    );

    console.log(
        "학년:",
        grade
    );

    console.log(
        "선택 반:",
        classNumber
    );

    console.log(
        "요청 URL:",
        url
    );


    try {

        const response =
            await fetch(url);

        const text =
            await response.text();


        console.log(
            "NEIS 응답:",
            text
        );


        if (!response.ok) {

            console.error(
                "HTTP 오류:",
                response.status
            );

            return [];
        }


        const data =
            JSON.parse(text);


        if (
            data?.RESULT?.CODE ===
            "INFO-200"
        ) {

            console.warn(
                "NEIS 데이터 없음:",
                formatDate(date),
                grade,
                classNumber
            );

            return [];
        }


        const rows =
            data
                ?.hisTimetable
                ?.[1]
                ?.row;


        if (
            !rows ||
            !Array.isArray(rows)
        ) {

            return [];
        }


        return rows;


    } catch (error) {

        console.error(
            "NEIS 요청 실패:",
            error
        );

        return [];
    }
}


/* =====================================================
   과목명
===================================================== */

function getSubject(row) {

    return (
        row?.ITRT_CNTNT ||
        row?.SBTR_NM ||
        row?.SUBJECT_NM ||
        "-"
    );
}


/* =====================================================
   교사명
===================================================== */

function getTeacher(row) {

    return (
        row?.TEACHER_NM ||
        ""
    );
}


/* =====================================================
   HTML escape
===================================================== */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =====================================================
   ⭐ 3학년 실제 반 찾기
===================================================== */

function getActualClass(row) {

    return (
        row?.CLASS_NM ||
        row?.CLRM_NM ||
        row?.CLRM_NO ||
        ""
    );
}


/* =====================================================
   ⭐ 3학년 전체 데이터에서 선택 반 찾기
===================================================== */

function filterThirdGradeClass(
    rows,
    selectedClass
) {

    const wanted =
        String(selectedClass).trim();


    console.log(
        "3학년 전체 데이터:",
        rows
    );


    /*
     * 실제 NEIS의 CLASS_NM 목록 확인
     */

    const classes =
        [
            ...new Set(
                rows
                    .map(
                        row =>
                            String(
                                getActualClass(row)
                            ).trim()
                    )
                    .filter(Boolean)
            )
        ];


    console.log(
        "⭐ NEIS에 실제 존재하는 3학년 반:",
        classes
    );


    /*
     * 일반적인 경우
     * CLASS_NM = "1", "2", "3"...
     */

    let filtered =
        rows.filter(
            row =>
                String(
                    getActualClass(row)
                ).trim() === wanted
        );


    /*
     * "2반" 형태로 저장된 경우
     */

    if (
        filtered.length === 0
    ) {

        filtered =
            rows.filter(
                row => {

                    const value =
                        String(
                            getActualClass(row)
                        )
                        .trim();

                    return (
                        value ===
                        `${wanted}반`
                    );
                }
            );
    }


    /*
     * "3-2" 형태로 저장된 경우
     */

    if (
        filtered.length === 0
    ) {

        filtered =
            rows.filter(
                row => {

                    const value =
                        String(
                            getActualClass(row)
                        )
                        .trim();

                    return (
                        value ===
                        `3-${wanted}`
                    );
                }
            );
    }


    console.log(
        "⭐ 선택된 3학년 데이터:",
        filtered
    );


    return filtered;
}


/* =====================================================
   하루 시간표
===================================================== */

async function getDayTimetable(
    date,
    grade,
    classNumber
) {

    const rows =
        await getTimetableData(
            date,
            grade,
            classNumber
        );


    /*
     * 3학년
     *
     * 전체 데이터를 받은 뒤
     * 실제 반을 찾아서 필터링
     */

    if (
        String(grade) === "3"
    ) {

        return filterThirdGradeClass(
            rows,
            classNumber
        );
    }


    return rows;
}


/* =====================================================
   주간 시간표
===================================================== */

async function loadWeeklyTimetable() {

    const result =
        document.getElementById(
            "timetable-result"
        );


    const grade =
        document.getElementById(
            "grade-select"
        ).value;


    const classNumber =
        document.getElementById(
            "class-select"
        ).value;


    if (
        !NEIS_KEY ||
        NEIS_KEY ===
        "여기에_네_NEIS_API_KEY_입력"
    ) {

        result.className =
            "error";

        result.textContent =
            "NEIS API KEY를 입력해주세요.";

        return;
    }


    result.className =
        "loading";

    result.textContent =
        "이번 주 시간표를 불러오는 중입니다...";


    const monday =
        getMonday(
            new Date()
        );


    const dates = [];


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const date =
            new Date(monday);

        date.setDate(
            monday.getDate() + i
        );

        dates.push(date);
    }


    try {

        /*
         * 월~금 모두 요청
         */

        const weekData =
            await Promise.all(
                dates.map(
                    date =>
                        getDayTimetable(
                            date,
                            grade,
                            classNumber
                        )
                )
            );


        console.log(
            "⭐ 최종 주간 시간표 데이터:",
            weekData
        );


        /*
         * 교시별 정리
         */

        const timetable = {};


        for (
            let day = 0;
            day < 5;
            day++
        ) {

            const rows =
                weekData[day];


            for (
                const row of rows
            ) {

                const period =
                    parseInt(
                        row?.PERIO,
                        10
                    );


                if (
                    Number.isNaN(period)
                ) {
                    continue;
                }


                if (
                    !timetable[period]
                ) {

                    timetable[period] = {
                        0: [],
                        1: [],
                        2: [],
                        3: [],
                        4: []
                    };
                }


                timetable[period][day]
                    .push(row);
            }
        }


        const periods =
            Object.keys(timetable)
                .map(Number)
                .sort(
                    (a,b) => a-b
                );


        /*
         * 데이터 없음
         */

        if (
            periods.length === 0
        ) {

            result.className =
                "error";

            result.innerHTML = `
                선택한 시간표를 찾지 못했습니다.
                <br><br>
                <small>
                    브라우저 콘솔(F12)을 확인하면
                    NEIS가 실제로 어떤 3학년 반을
                    보내는지 확인할 수 있습니다.
                </small>
            `;

            return;
        }


        /*
         * 테이블
         */

        let html = `
            <table class="week-table">

                <thead>

                    <tr>

                        <th class="period">
                            교시
                        </th>

                        <th>월</th>
                        <th>화</th>
                        <th>수</th>
                        <th>목</th>
                        <th>금</th>

                    </tr>

                </thead>

                <tbody>
        `;


        for (
            const period of periods
        ) {

            html += `
                <tr>

                    <td class="period">
                        ${period}
                    </td>
            `;


            for (
                let day = 0;
                day < 5;
                day++
            ) {

                const rows =
                    timetable[period][day];


                if (
                    !rows ||
                    rows.length === 0
                ) {

                    html += `
                        <td>-</td>
                    `;

                    continue;
                }


                /*
                 * ⭐ 핵심
                 *
                 * 같은 교시에
                 *
                 * 미술
                 * 음악
                 *
                 * 처럼 여러 과목이 있으면
                 * 전부 표시한다.
                 */

                html += `<td>`;


                rows.forEach(
                    (row, index) => {

                        const subject =
                            getSubject(row);


                        const teacher =
                            getTeacher(row);


                        html += `
                            <div class="subject-box">

                                <div class="subject">
                                    ${escapeHtml(
                                        subject
                                    )}
                                </div>

                                ${
                                    teacher
                                    ?
                                    `
                                    <div class="teacher">
                                        ${escapeHtml(
                                            teacher
                                        )}
                                    </div>
                                    `
                                    :
                                    ""
                                }

                            </div>
                        `;


                        if (
                            index <
                            rows.length - 1
                        ) {

                            html += `
                                <div class="subject-divider"></div>
                            `;
                        }

                    }
                );


                html += `</td>`;
            }


            html += `
                </tr>
            `;
        }


        html += `
                </tbody>
            </table>
        `;


        result.className = "";

        result.innerHTML =
            html;


    } catch (error) {

        console.error(
            "주간 시간표 오류:",
            error
        );

        result.className =
            "error";

        result.textContent =
            "시간표를 불러오는 중 오류가 발생했습니다.";
    }
}
