<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>관인고등학교 통합앱</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans KR",
                sans-serif;
            background: #f5f7fb;
            color: #222;
            padding-bottom: 80px;
        }

        header {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            padding: 22px 18px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        header h1 {
            margin: 0;
            font-size: 21px;
            font-weight: 800;
        }

        header p {
            margin: 6px 0 0;
            font-size: 13px;
            opacity: 0.9;
        }

        main {
            padding: 16px;
            max-width: 900px;
            margin: 0 auto;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 800;
            margin: 0 0 10px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 17px;
            margin-bottom: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .meal-date {
            font-size: 13px;
            color: #777;
            margin-bottom: 10px;
        }

        .meal-title {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .meal-menu {
            line-height: 1.8;
            font-size: 15px;
        }

        .loading {
            color: #777;
            font-size: 14px;
        }

        .error {
            color: #dc2626;
            font-size: 14px;
        }

        .select-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        select {
            flex: 1;
            min-width: 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 11px;
            font-size: 14px;
            background: white;
        }

        .timetable-card {
            overflow-x: auto;
        }

        .week-table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .week-table th {
            background: #f1f5f9;
            font-weight: 800;
            font-size: 13px;
            padding: 10px 5px;
            border: 1px solid #e5e7eb;
        }

        .week-table td {
            border: 1px solid #e5e7eb;
            padding: 7px;
            text-align: center;
            vertical-align: middle;
            height: 65px;
            font-size: 13px;
        }

        .period-cell {
            width: 55px;
            background: #f8fafc;
            font-weight: 800;
        }

        .subject {
            font-weight: 700;
            white-space: pre-line;
            line-height: 1.4;
        }

        .teacher {
            font-size: 11px;
            color: #888;
            margin-top: 3px;
        }

        .multiple-subject {
            padding: 4px 0;
        }

        .divider {
            height: 1px;
            background: #e5e7eb;
            margin: 5px 0;
        }

        .link-card {
            display: block;
            text-decoration: none;
            color: inherit;
            background: white;
            border-radius: 16px;
            padding: 17px;
            margin-bottom: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .link-card strong {
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .link-card span {
            color: #777;
            font-size: 13px;
        }

        .notice {
            background: white;
            border-radius: 16px;
            padding: 17px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 65px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 200;
        }

        .nav-item {
            border: none;
            background: none;
            font-size: 11px;
            color: #777;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }

        .nav-item span:first-child {
            font-size: 21px;
        }

        .nav-item.active {
            color: #2563eb;
            font-weight: 700;
        }

        .refresh-btn {
            width: 100%;
            border: none;
            border-radius: 11px;
            padding: 12px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .today-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #dbeafe;
            color: #2563eb;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 5px;
        }

        @media (max-width: 600px) {
            main {
                padding: 12px;
            }

            .card {
                padding: 14px;
            }

            .week-table {
                min-width: 620px;
            }
        }
    </style>
</head>

<main>

<script>

/* =========================================================
   기본 설정
========================================================= */

// ⚠️ 여기에 네가 발급받은 NEIS API KEY를 입력
const NEIS_KEY = "7578d97feec449a28b001c18538d22ed";

const OFFICE_CODE = "J10";
const SCHOOL_CODE = "7530049";

const MEAL_SERVER =
    "https://meal-server-1.onrender.com/meal";


/* =========================================================
   날짜
========================================================= */

function formatDate(date) {

    const year = date.getFullYear();

    const month =
        String(date.getMonth() + 1)
            .padStart(2, "0");

    const day =
        String(date.getDate())
            .padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function formatKoreanDate(date) {

    const month =
        date.getMonth() + 1;

    const day =
        date.getDate();

    const weekdays =
        [
            "일",
            "월",
            "화",
            "수",
            "목",
            "금",
            "토"
        ];

    const weekday =
        weekdays[date.getDay()];

    return `${month}월 ${day}일 (${weekday})`;
}


/* =========================================================
   월요일 구하기
========================================================= */

function getMonday(date) {

    const result =
        new Date(date);

    const day =
        result.getDay();

    const diff =
        day === 0
            ? -6
            : 1 - day;

    result.setDate(
        result.getDate() + diff
    );

    result.setHours(0, 0, 0, 0);

    return result;
}


/* =========================================================
   급식
========================================================= */

async function loadMeal() {

    const result =
        document.getElementById(
            "meal-result"
        );

    const dateText =
        document.getElementById(
            "meal-date"
        );

    const today =
        new Date();

    dateText.textContent =
        formatKoreanDate(today);

    result.className =
        "loading";

    result.textContent =
        "급식 정보를 불러오는 중입니다...";

    try {

        const response =
            await fetch(
                MEAL_SERVER
            );

        if (!response.ok) {
            throw new Error(
                "급식 서버 응답 오류"
            );
        }

        const data =
            await response.json();

        console.log(
            "급식 데이터:",
            data
        );

        const rows =
            data?.mealServiceDietInfo?.[1]?.row;

        if (!rows || rows.length === 0) {

            result.className =
                "error";

            result.textContent =
                "오늘 급식 정보가 없습니다.";

            return;
        }

        let todayMeal = null;

        const todayString =
            formatDate(today);

        for (const row of rows) {

            const date =
                row?.MLSV_YMD;

            if (date === todayString) {
                todayMeal = row;
                break;
            }
        }

        if (!todayMeal) {

            result.className =
                "error";

            result.textContent =
                "오늘 급식 정보가 없습니다.";

            return;
        }

        let menu =
            todayMeal.DDISH_NM || "";

        menu =
            menu
                .replace(/<br\/>/gi, "\n")
                .replace(/<br>/gi, "\n")
                .replace(/\([^)]*\)/g, "")
                .replace(/\*/g, "")
                .trim();

        result.className =
            "meal-menu";

        result.innerText =
            menu || "급식 정보가 없습니다.";

    } catch (error) {

        console.error(
            "급식 오류:",
            error
        );

        result.className =
            "error";

        result.textContent =
            "급식 정보를 불러오지 못했습니다.";
    }
}


/* =========================================================
   시간표 URL
========================================================= */

function makeTimetableUrl(
    dateString,
    grade,
    classNumber
) {

    const params =
        new URLSearchParams({

            Type: "json",

            pIndex: "1",

            pSize: "100",

            ATPT_OFCDC_SC_CODE:
                OFFICE_CODE,

            SD_SCHUL_CODE:
                SCHOOL_CODE,

            ALL_TI_YMD:
                dateString,

            GRADE:
                String(grade),

            CLASS_NM:
                String(classNumber),

            KEY:
                NEIS_KEY
        });

    return (
        "https://open.neis.go.kr/hub/hisTimetable?"
        + params.toString()
    );
}


/* =========================================================
   과목명 가져오기
========================================================= */

function getSubjectFromRow(row) {

    return (
        row?.ITRT_CNTNT ||
        row?.SBTR_NM ||
        row?.SUBJECT_NM ||
        "-"
    );
}


/* =========================================================
   교사명 가져오기
========================================================= */

function getTeacherFromRow(row) {

    return (
        row?.TEACHER_NM ||
        ""
    );
}


/* =========================================================
   과목 처리
   ⭐ 문과/이과 구분 없음
   ⭐ 같은 교시 여러 과목 전부 표시
========================================================= */

function processSubject(subject) {

    if (!subject) {
        return "-";
    }

    return String(subject)
        .replace(
            /<br\s*\/?>/gi,
            "\n"
        )
        .trim();
}


/* =========================================================
   HTML 안전 처리
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   하루 시간표 가져오기
========================================================= */

async function fetchDayTimetable(
    date,
    grade,
    classNumber
) {

    const dateString =
        formatDate(date);

    const url =
        makeTimetableUrl(
            dateString,
            grade,
            classNumber
        );

    console.log(
        "시간표 요청:",
        dateString,
        "학년:",
        grade,
        "반:",
        classNumber
    );

    try {

        const response =
            await fetch(url);

        const text =
            await response.text();

        console.log(
            "NEIS 원본:",
            dateString,
            text
        );

        if (!response.ok) {

            console.error(
                "NEIS HTTP 오류:",
                response.status
            );

            return [];
        }

        let data;

        try {

            data =
                JSON.parse(text);

        } catch (jsonError) {

            console.error(
                "JSON 변환 실패:",
                jsonError
            );

            return [];
        }


        /* 데이터 없음 */

        if (
            data?.RESULT?.CODE ===
            "INFO-200"
        ) {

            console.warn(
                "시간표 데이터 없음:",
                dateString
            );

            return [];
        }


        const rows =
            data?.hisTimetable?.[1]?.row;

        if (!rows) {

            console.warn(
                "시간표 row 없음:",
                dateString
            );

            return [];
        }

        return rows;

    } catch (error) {

        console.error(
            "시간표 요청 오류:",
            dateString,
            error
        );

        return [];
    }
}


/* =========================================================
   주간 시간표 만들기
========================================================= */

async function loadWeeklyTimetable() {

    const result =
        document.getElementById(
            "timetable-result"
        );

    const grade =
        document.getElementById(
            "grade-select"
        ).value;

    const classNumber =
        document.getElementById(
            "class-select"
        ).value;


    result.className =
        "loading";

    result.innerHTML =
        "이번 주 시간표를 불러오는 중입니다...";


    if (
        !NEIS_KEY ||
        NEIS_KEY ===
        "여기에_네_NEIS_API_KEY_입력"
    ) {

        result.className =
            "error";

        result.innerHTML =
            "NEIS API KEY를 입력해주세요.";

        return;
    }


    const today =
        new Date();

    const monday =
        getMonday(today);


    const weekDates = [];

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const date =
            new Date(monday);

        date.setDate(
            monday.getDate() + i
        );

        weekDates.push(date);
    }


    try {

        const dailyResults =
            await Promise.all(
                weekDates.map(
                    date =>
                        fetchDayTimetable(
                            date,
                            grade,
                            classNumber
                        )
                )
            );


        /* -----------------------------------------
           교시별 데이터 저장
        ----------------------------------------- */

        const timetable = {};

        for (
            let dayIndex = 0;
            dayIndex < 5;
            dayIndex++
        ) {

            const rows =
                dailyResults[dayIndex];

            for (const row of rows) {

                const period =
                    parseInt(
                        row?.PERIO,
                        10
                    );

                if (
                    Number.isNaN(period)
                ) {
                    continue;
                }


                if (
                    !timetable[period]
                ) {

                    timetable[period] =
                        {
                            0: [],
                            1: [],
                            2: [],
                            3: [],
                            4: []
                        };
                }


                timetable[period][dayIndex]
                    .push(row);
            }
        }


        const periods =
            Object.keys(timetable)
                .map(Number)
                .sort(
                    (a, b) => a - b
                );


        if (periods.length === 0) {

            result.className =
                "error";

            result.innerHTML = `
                이번 주 시간표를 찾지 못했습니다.
                <br><br>
                <small>
                    선택한 학년/반의 NEIS 시간표 데이터가
                    없는 경우 이렇게 표시될 수 있습니다.
                </small>
            `;

            return;
        }


        /* -----------------------------------------
           테이블 생성
        ----------------------------------------- */

        let html = `
            <table class="week-table">

                <thead>
                    <tr>
                        <th class="period-cell">
                            교시
                        </th>

                        <th>
                            월
                        </th>

                        <th>
                            화
                        </th>

                        <th>
                            수
                        </th>

                        <th>
                            목
                        </th>

                        <th>
                            금
                        </th>
                    </tr>
                </thead>

                <tbody>
        `;


        for (const period of periods) {

            html += `
                <tr>

                    <td class="period-cell">
                        ${period}
                    </td>
            `;


            for (
                let dayIndex = 0;
                dayIndex < 5;
                dayIndex++
            ) {

                const rows =
                    timetable[period][dayIndex];


                /* 해당 요일/교시에 과목 없음 */

                if (
                    !rows ||
                    rows.length === 0
                ) {

                    html += `
                        <td>
                            -
                        </td>
                    `;

                    continue;
                }


                /* -----------------------------------------
                   같은 교시에 여러 과목이 있으면
                   전부 표시
                ----------------------------------------- */

                html += `<td>`;


                rows.forEach(
                    (row, rowIndex) => {

                        const subject =
                            processSubject(
                                getSubjectFromRow(
                                    row
                                )
                            );

                        const teacher =
                            getTeacherFromRow(
                                row
                            );


                        html += `
                            <div class="multiple-subject">

                                <div class="subject">
                                    ${escapeHtml(
                                        subject
                                    )}
                                </div>

                                ${
                                    teacher
                                        ? `
                                            <div class="teacher">
                                                ${escapeHtml(
                                                    teacher
                                                )}
                                            </div>
                                          `
                                        : ""
                                }

                            </div>
                        `;


                        if (
                            rowIndex <
                            rows.length - 1
                        ) {

                            html += `
                                <div class="divider"></div>
                            `;
                        }

                    }
                );


                html += `</td>`;
            }


            html += `
                </tr>
            `;
        }


        html += `
                </tbody>
            </table>
        `;


        result.className = "";

        result.innerHTML =
            html;

    } catch (error) {

        console.error(
            "주간 시간표 오류:",
            error
        );

        result.className =
            "error";

        result.textContent =
            "시간표를 불러오는 중 오류가 발생했습니다.";
    }
}

========================================================= */

function scrollToTop() {

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function scrollToMeal() {

    const element =
        document.querySelector(
            "#meal-result"
        );

    if (!element) {
        return;
    }

    element.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}


function scrollToTimetable() {

    const element =
        document.querySelector(
            "#timetable-result"
        );

    if (!element) {
        return;
    }

    element.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}
