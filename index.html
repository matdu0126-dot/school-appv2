<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관인고등학교 앱</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
    }

    .container {
      padding: 20px;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin: 15px auto;
      max-width: 500px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    button, select {
      padding: 10px 15px;
      font-size: 16px;
      margin: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    button {
      background: white;
    }

    .hidden {
      display: none;
    }

    p {
      margin: 8px 0;
    }
  </style>
</head>
<body>

<!-- 학교 선택 -->
<div id="selectScreen">

  <header>🏫 학교 선택</header>

  <div class="container">

    <div class="card">

      <select id="schoolSelect">
        <option>학교를 선택하세요</option>
        <option>관인고등학교</option>
      </select>

      <br>

      <button onclick="enterApp()">
        들어가기
      </button>

    </div>

  </div>

</div>

<!-- 메뉴 -->
<div id="menuScreen" class="hidden">

  <header id="schoolName">
    🏫 관인고등학교
  </header>

  <div class="container">

    <div class="card">

      <h2>메뉴 선택</h2>

      <button onclick="openPage('timetable')">
        📅 시간표
      </button>

      <button onclick="openPage('meal')">
        🍱 급식
      </button>

      <br>

      <button onclick="goBack()">
        ← 학교 다시 선택
      </button>

    </div>

  </div>

</div>

<!-- 시간표 -->
<div id="timetable" class="hidden">

  <header>📅 시간표</header>

  <div class="container">

    <div class="card">

      <!-- 학년 -->
      <select id="gradeSelect" onchange="toggleTrackSelect()">
        <option value="1">1학년</option>
        <option value="2">2학년</option>
        <option value="3">3학년</option>
      </select>

      <!-- 반 -->
      <select id="classSelect">
        <option value="1">1반</option>
        <option value="2">2반</option>
      </select>

      <!-- 문과/이과 -->
      <select id="trackSelect" class="hidden">
        <option value="문과">문과</option>
        <option value="이과">이과</option>
      </select>

      <br>

      <button onclick="loadTimetable()">
        확인
      </button>

    </div>

    <div class="card" id="timetableContent">
      시간표를 선택해주세요.
    </div>

    <button onclick="goMenu()">
      ← 메뉴로
    </button>

  </div>

</div>

<!-- 급식 -->
<div id="meal" class="hidden">

  <header>🍱 오늘 급식</header>

  <div class="container">

    <div class="card" id="mealContent">
      아직 불러오지 않음
    </div>

    <button onclick="goMenu()">
      ← 메뉴로
    </button>

  </div>

</div>

<script>

// ================= 학교 들어가기 =================
function enterApp() {

  const school =
    document.getElementById("schoolSelect").value;

  if (school === "학교를 선택하세요") {

    alert("학교를 선택해주세요!");
    return;
  }

  localStorage.setItem("school", school);

  document.getElementById("schoolName").innerText =
    "🏫 " + school;

  document.getElementById("selectScreen")
    .classList.add("hidden");

  document.getElementById("menuScreen")
    .classList.remove("hidden");
}

// ================= 페이지 열기 =================
function openPage(page) {

  document.getElementById("menuScreen")
    .classList.add("hidden");

  document.getElementById(page)
    .classList.remove("hidden");

  if (page === "meal") {
    loadMeal();
  }
}

// ================= 메뉴로 =================
function goMenu() {

  document.getElementById("timetable")
    .classList.add("hidden");

  document.getElementById("meal")
    .classList.add("hidden");

  document.getElementById("menuScreen")
    .classList.remove("hidden");
}

// ================= 학교 선택으로 =================
function goBack() {

  localStorage.removeItem("school");

  document.getElementById("menuScreen")
    .classList.add("hidden");

  document.getElementById("selectScreen")
    .classList.remove("hidden");
}

// ================= 문과/이과 표시 =================
function toggleTrackSelect() {

  const grade =
    document.getElementById("gradeSelect").value;

  const trackSelect =
    document.getElementById("trackSelect");

  if (grade === "3") {

    trackSelect.classList.remove("hidden");

  } else {

    trackSelect.classList.add("hidden");

  }
}

// ================= 시간표 =================
async function loadTimetable() {

  const grade =
    document.getElementById("gradeSelect").value;

  const classNum =
    document.getElementById("classSelect").value;

  const track =
    document.getElementById("trackSelect").value;

  const timetableContent =
    document.getElementById("timetableContent");

  timetableContent.innerHTML =
    "시간표 불러오는 중...";

  // 오늘 날짜
  const today = new Date();

  const year = today.getFullYear();

  const month =
    String(today.getMonth() + 1)
    .padStart(2, "0");

  const day =
    String(today.getDate())
    .padStart(2, "0");

  const date =
    `${year}${month}${day}`;

  try {

    const url =
      `https://open.neis.go.kr/hub/hisTimetable` +
      `?KEY=7578d97feec449a28b001c18538d22ed` +
      `&Type=json` +
      `&ATPT_OFCDC_SC_CODE=J10` +
      `&SD_SCHUL_CODE=7530049` +
      `&GRADE=${grade}` +
      `&CLASS_NM=${classNum}` +
      `&ALL_TI_YMD=${date}`;

    const response =
      await fetch(url);

    const data =
      await response.json();

    console.log(data);

    if (
      data.hisTimetable &&
      data.hisTimetable[1] &&
      data.hisTimetable[1].row
    ) {

      let html =
        `<h3>${grade}학년 ${classNum}반 시간표</h3>`;

      if (grade === "3") {
        html += `<p>${track}</p>`;
      }

      data.hisTimetable[1].row
      .forEach(item => {

        let subject =
          item.ITRT_CNTNT;

        // 음악/미술 같은 경우 분리
        if (
          grade === "3" &&
          subject.includes("/")
        ) {

          const parts =
            subject.split("/");

          if (track === "문과") {

            subject = parts[0];

          } else {

            subject = parts[1];

          }
        }

        html +=
          `<p>${item.PERIO}교시 - ${subject}</p>`;

      });

      timetableContent.innerHTML =
        html;

    } else {

      timetableContent.innerHTML =
        "시간표 정보 없음";

    }

  } catch (error) {

    console.log(error);

    timetableContent.innerHTML =
      "시간표 불러오기 실패";

  }
}

// ================= 급식 =================
async function loadMeal() {

  const mealContent =
    document.getElementById("mealContent");

  mealContent.innerHTML =
    "불러오는 중...";

  try {

    const response = await fetch(
      "https://meal-server-1.onrender.com/meal"
    );

    const data = await response.json();

    if (
      data.mealServiceDietInfo &&
      data.mealServiceDietInfo[1] &&
      data.mealServiceDietInfo[1].row &&
      data.mealServiceDietInfo[1].row.length > 0
    ) {

      const meal =
        data.mealServiceDietInfo[1]
        .row[0]
        .DDISH_NM;

      const foods =
        meal.split("<br/>");

      let html = "";

      foods.forEach(food => {
        html += `<p>${food}</p>`;
      });

      mealContent.innerHTML = html;

    } else {

      mealContent.innerHTML =
        "급식 정보 없음";

    }

  } catch (error) {

    console.log(error);

    mealContent.innerHTML =
      "에러 발생";

  }
}

// ================= 자동 로그인 =================
window.onload = () => {

  const savedSchool =
    localStorage.getItem("school");

  if (savedSchool) {

    document.getElementById("schoolName")
      .innerText =
      "🏫 " + savedSchool;

    document.getElementById("selectScreen")
      .classList.add("hidden");

    document.getElementById("menuScreen")
      .classList.remove("hidden");
  }

  toggleTrackSelect();
};

</script>

</body>
</html>
