<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관인고 급식 테스트</title>

  <style>
    body{
      font-family: Arial;
      background:#f5f5f5;
      padding:20px;
    }

    .card{
      background:white;
      border-radius:12px;
      padding:20px;
      max-width:500px;
      margin:auto;
    }

    button{
      padding:10px 20px;
      font-size:16px;
      cursor:pointer;
    }

    p{
      margin:8px 0;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>🍱 관인고 급식</h2>

  <button onclick="loadMeal()">급식 불러오기</button>

  <div id="mealContent" style="margin-top:20px;">
    아직 불러오지 않음
  </div>
</div>

<script>
async function loadMeal() {

  const mealContent = document.getElementById("mealContent");

  mealContent.innerHTML = "불러오는 중...";

  try {

    const response = await fetch(
      "https://meal-server-1.onrender.com/meal"
    );

    const data = await response.json();

    console.log(data);

    if (
      data.mealServiceDietInfo &&
      data.mealServiceDietInfo[1] &&
      data.mealServiceDietInfo[1].row &&
      data.mealServiceDietInfo[1].row.length > 0
    ) {

      const meal =
        data.mealServiceDietInfo[1].row[0].DDISH_NM;

      const foods = meal.split("<br/>");

      let html = "";

      foods.forEach(food => {
        html += `<p>${food}</p>`;
      });

      mealContent.innerHTML = html;

    } else {

      mealContent.innerHTML = "급식 정보 없음";

    }

  } catch (error) {

    console.log(error);

    mealContent.innerHTML =
      "에러 발생";

  }
}
</script>

</body>
</html>
