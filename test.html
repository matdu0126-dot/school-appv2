<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>학교 앱</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      text-align: center;
    }

    .hidden {
      display: none;
    }

    header {
      background: white;
      padding: 15px;
      border-bottom: 1px solid #ddd;
      font-weight: bold;
    }

    .container {
      padding: 20px;
    }

    button, select {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }

    .card {
      background: white;
      margin: 15px;
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<!-- 학교 선택 -->
<div id="selectScreen" class="container">
  <h2>🏫 학교 선택</h2>

  <select id="schoolSelect">
    <option>학교를 선택하세요</option>
    <option>관인고등학교</option>
  </select>

  <br>
  <button onclick="enterApp()">들어가기</button>
</div>

<!-- 메뉴 -->
<div id="menuScreen" class="hidden">
  <header id="schoolName">🏫 학교</header>

  <div class="container">
    <h2>메뉴 선택</h2>

    <button onclick="openPage('timetable')">📅 시간표</button><br>
    <button onclick="openPage('meal')">🍱 급식</button><br>
    <button onclick="openPage('notice')">📢 공지사항</button><br>
    <button onclick="openPage('letter')">📄 가정통신문</button><br>

    <button onclick="goBack()">← 학교 다시 선택</button>
  </div>
</div>

<!-- 시간표 -->
<div id="timetable" class="hidden">
  <header>📅 시간표</header>

  <div class="card">
    <h3>학년 / 반 선택</h3>

    <select id="gradeSelect">
      <option value="1">1학년</option>
      <option value="2">2학년</option>
      <option value="3">3학년</option>
    </select>

    <select id="classSelect">
      <option value="1">1반</option>
      <option value="2">2반</option>
    </select>

    <br>
    <button onclick="saveClass()">확인</button>
  </div>

  <div class="card" id="timetableContent"></div>

  <button onclick="goMenu()">← 메뉴로</button>
</div>

<!-- 급식 -->
<div id="meal" class="hidden">
  <header>🍱 급식</header>
  <div class="card">
    <p>급식 정보</p>
  </div>
  <button onclick="goMenu()">← 메뉴로</button>
</div>

<!-- 공지 -->
<div id="notice" class="hidden">
  <header>📢 공지사항</header>
  <div class="card">
    <p>공지 내용</p>
  </div>
  <button onclick="goMenu()">← 메뉴로</button>
</div>

<!-- 가정통신문 -->
<div id="letter" class="hidden">
  <header>📄 가정통신문</header>
  <div class="card">
    <p>가정통신문 내용</p>
  </div>
  <button onclick="goMenu()">← 메뉴로</button>
</div>

<script>
  // 시간표 데이터
  const timetableData = {
    "1-1": { 월: ["국어", "수학"], 화: ["영어", "과학"] },
    "1-2": { 월: ["사회", "영어"], 화: ["수학", "체육"] },
    "2-1": { 월: ["물리", "수학"], 화: ["영어", "화학"] },
    "2-2": { 월: ["국어", "체육"], 화: ["수학", "영어"] },
    "3-1": { 월: ["수학", "영어"], 화: ["국어", "사회"] },
    "3-2": { 월: ["과학", "체육"], 화: ["영어", "수학"] }
  };

  function enterApp() {
    const school = document.getElementById("schoolSelect").value;

    if (school === "학교를 선택하세요") {
      alert("학교를 선택해주세요!");
      return;
    }

    localStorage.setItem("school", school);

    document.getElementById("schoolName").innerText = "🏫 " + school;

    document.getElementById("selectScreen").classList.add("hidden");
    document.getElementById("menuScreen").classList.remove("hidden");
  }

  function openPage(page) {
    document.getElementById("menuScreen").classList.add("hidden");
    document.getElementById(page).classList.remove("hidden");

    if (page === "timetable") {
      loadTimetable();
    }
  }

  function goMenu() {
    document.querySelectorAll("#timetable, #meal, #notice, #letter")
      .forEach(el => el.classList.add("hidden"));

    document.getElementById("menuScreen").classList.remove("hidden");
  }

  function goBack() {
    localStorage.removeItem("school");

    document.getElementById("menuScreen").classList.add("hidden");
    document.getElementById("selectScreen").classList.remove("hidden");
  }

  function saveClass() {
    const grade = document.getElementById("gradeSelect").value;
    const classNum = document.getElementById("classSelect").value;

    const key = grade + "-" + classNum;

    localStorage.setItem("class", key);

    loadTimetable();
  }

  function loadTimetable() {
    const savedClass = localStorage.getItem("class");

    if (!savedClass) {
      document.getElementById("timetableContent").innerHTML =
        "<p>학년과 반을 선택해주세요</p>";
      return;
    }

    const today = new Date().getDay();
    const days = ["일","월","화","수","목","금","토"];
    const todayName = days[today];

    const data = timetableData[savedClass];

    let html = `<h3>${savedClass} (${todayName}요일)</h3>`;

    if (data && data[todayName]) {
      data[todayName].forEach((subject, i) => {
        html += `<p>${i+1}교시: ${subject}</p>`;
      });
    } else {
      html += "<p>시간표 없음</p>";
    }

    document.getElementById("timetableContent").innerHTML = html;
  }

  window.onload = function() {
    const savedSchool = localStorage.getItem("school");

    if (savedSchool) {
      document.getElementById("schoolName").innerText = "🏫 " + savedSchool;

      document.getElementById("selectScreen").classList.add("hidden");
      document.getElementById("menuScreen").classList.remove("hidden");
    }
  }
</script>

</body>
</html>
